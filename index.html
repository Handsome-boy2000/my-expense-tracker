<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>多币种个人记账本</title>
    <!-- Tailwind CSS v3 CDN -->
    <script src="https://cdn.jsdelivr.net/npm/tailwindcss@3.4.1/lib/index.min.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Chart.js CDN -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <!-- SheetJS (xlsx) for Excel import/export -->
    <script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
    <!-- FontAwesome for icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap');
        body { font-family: 'Inter', sans-serif; -webkit-tap-highlight-color: transparent; background-color: #f8fafc; }
        .no-scrollbar::-webkit-scrollbar { display: none; }
        .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
    </style>
</head>
<body class="text-slate-800 min-h-screen pb-24">

    <!-- 登录/注册弹窗层 -->
    <div id="authOverlay" class="fixed inset-0 bg-slate-950/80 backdrop-blur-md z-50 flex items-center justify-center p-4">
        <div class="bg-white rounded-3xl max-w-sm w-full p-6 sm:p-8 shadow-2xl space-y-5">
            <div class="flex justify-between items-center">
                <div class="inline-flex items-center justify-center w-12 h-12 rounded-2xl bg-indigo-50 text-indigo-600 text-xl shadow-inner">
                    <i class="fa-solid fa-wallet"></i>
                </div>
                <select id="authLangSelect" onchange="changeLanguage(this.value)" class="text-xs bg-slate-100 text-slate-700 border border-slate-200 rounded-xl px-2.5 py-1.5 focus:outline-none font-medium">
                    <option value="zh">🇨🇳 简体中文</option>
                    <option value="zh-TW">🇭🇰 繁體中文</option>
                    <option value="en">🇬🇧 English</option>
                    <option value="es">🇪🇸 Español</option>
                    <option value="it">🇮🇹 Italiano</option>
                    <option value="fr">🇫🇷 Français</option>
                    <option value="pt">🇵🇹 Português</option>
                    <option value="ja">🇯🇵 日本語</option>
                    <option value="ko">🇰🇷 한국어</option>
                </select>
            </div>

            <div class="text-center space-y-1">
                <h2 id="i18nAuthTitle" class="text-xl font-bold text-slate-900">多币种个人记账本</h2>
                <p id="i18nAuthSub" class="text-xs text-slate-400">PostgreSQL 多用户安全隔离系统</p>
            </div>

            <div class="flex bg-slate-100 p-1 rounded-xl">
                <button type="button" id="tabLoginBtn" onclick="switchAuthMode('login')" class="flex-1 py-2 text-xs font-bold rounded-lg bg-white text-indigo-600 shadow-sm transition" data-i18n="loginTab">登录账号</button>
                <button type="button" id="tabRegBtn" onclick="switchAuthMode('register')" class="flex-1 py-2 text-xs font-bold rounded-lg text-slate-500 transition" data-i18n="regTab">注册新账号</button>
            </div>

            <form id="authForm" onsubmit="handleAuth(event)" class="space-y-4">
                <div>
                    <label class="block text-xs font-semibold text-slate-500 mb-1" data-i18n="usernameLabel">用户名 / 账号</label>
                    <input type="text" id="authUsername" required placeholder="请输入用户名..." class="w-full text-sm bg-slate-50 border border-slate-200 rounded-xl px-3.5 py-3 focus:outline-none focus:ring-2 focus:ring-indigo-500">
                </div>
                <div>
                    <label class="block text-xs font-semibold text-slate-500 mb-1" data-i18n="pwdLabel">密码</label>
                    <div class="relative">
                        <input type="password" id="authPassword" required placeholder="请输入密码..." class="w-full text-sm bg-slate-50 border border-slate-200 rounded-xl px-3.5 py-3 pr-10 focus:outline-none focus:ring-2 focus:ring-indigo-500">
                        <button type="button" onclick="togglePasswordVisibility('authPassword', 'authPwdIcon')" class="absolute inset-y-0 right-0 pr-3 flex items-center text-slate-400 hover:text-slate-600">
                            <i id="authPwdIcon" class="fa-solid fa-eye text-xs"></i>
                        </button>
                    </div>
                    <p id="pwdTip" class="text-[11px] text-slate-400 mt-1 hidden" data-i18n="pwdTipText">密码需不少于8位，包含大小写字母、数字和特殊字符</p>
                </div>
                <div id="authErrorMsg" class="text-xs text-rose-500 hidden font-medium text-center"></div>
                <button type="submit" id="authSubmitBtn" class="w-full bg-indigo-600 hover:bg-indigo-700 text-white font-bold py-3 rounded-xl transition shadow-lg shadow-indigo-200 text-sm" data-i18n="loginBtn">立即登录</button>
            </form>
        </div>
    </div>

    <!-- 顶栏：类似顶级 FinTech App 的优雅设计 -->
    <header class="bg-slate-900 text-white shadow-lg sticky top-0 z-40 pb-4">
        <div class="max-w-md mx-auto px-4 pt-4 flex flex-col gap-4">
            <div class="flex items-center justify-between">
                <div class="flex items-center space-x-2.5">
                    <div class="w-9 h-9 rounded-full bg-indigo-600 flex items-center justify-center font-bold text-sm shadow-md" id="userAvatarText">U</div>
                    <div>
                        <p class="text-[10px] text-slate-400 uppercase tracking-wider" data-i18n="welcomeBack">欢迎回来</p>
                        <h1 id="userDisplay" class="text-sm font-bold truncate max-w-[120px]">账户</h1>
                    </div>
                </div>
                <div class="flex items-center gap-2">
                    <select id="langSelect" onchange="changeLanguage(this.value)" class="text-xs bg-slate-800 text-slate-300 border border-slate-700 rounded-xl px-2.5 py-1.5 focus:outline-none font-medium">
                        <option value="zh">🇨🇳 简体中文</option>
                        <option value="zh-TW">🇭🇰 繁體中文</option>
                        <option value="en">🇬🇧 English</option>
                        <option value="es">🇪🇸 Español</option>
                        <option value="it">🇮🇹 Italiano</option>
                        <option value="fr">🇫🇷 Français</option>
                        <option value="pt">🇵🇹 Português</option>
                        <option value="ja">🇯🇵 日本語</option>
                        <option value="ko">🇰🇷 한국어</option>
                    </select>
                </div>
            </div>

            <!-- 核心资产大卡片 (仿照参考图中的蓝色渐变卡片) -->
            <div class="bg-gradient-to-br from-indigo-600 to-blue-700 rounded-3xl p-5 shadow-xl text-white relative overflow-hidden">
                <div class="absolute -right-6 -bottom-6 w-32 h-32 bg-white/10 rounded-full blur-xl pointer-events-none"></div>
                <div class="flex justify-between items-start mb-3">
                    <div>
                        <p class="text-[11px] text-indigo-200 font-medium uppercase tracking-wider" data-i18n="convertedBalance">折算净结余 (实时)</p>
                        <h2 id="netBalanceConverted" class="text-2xl sm:text-3xl font-extrabold tracking-tight mt-1">¥ 0.00</h2>
                    </div>
                    <select id="baseCurrency" onchange="updateBaseCurrency()" class="text-xs bg-white/20 backdrop-blur-md text-white border border-white/30 rounded-xl px-2.5 py-1 font-bold focus:outline-none">
                        <option value="CNY" class="text-slate-800">CNY</option>
                        <option value="EUR" class="text-slate-800">EUR</option>
                        <option value="USD" class="text-slate-800">USD</option>
                        <option value="GBP" class="text-slate-800">GBP</option>
                        <option value="JPY" class="text-slate-800">JPY</option>
                    </select>
                </div>
                <div class="grid grid-cols-2 gap-2 pt-3 border-t border-white/15 text-xs">
                    <div>
                        <span class="text-indigo-200 text-[10px]" data-i18n="totalIncome">总收入</span>
                        <p id="totalIncomeConverted" class="font-bold text-emerald-300">¥ 0.00</p>
                    </div>
                    <div>
                        <span class="text-indigo-200 text-[10px]" data-i18n="totalExpenseBalance">总支出</span>
                        <p id="totalExpenseConverted" class="font-bold text-rose-300">¥ 0.00</p>
                    </div>
                </div>
            </div>

            <!-- 快捷操作圆形按钮组 (仿照参考图中的快捷操作) -->
            <div class="grid grid-cols-4 gap-2 pt-1">
                <button onclick="openModal()" class="flex flex-col items-center justify-center p-2.5 rounded-2xl bg-slate-800 hover:bg-slate-700 transition active:scale-95 border border-slate-700/60 shadow-sm">
                    <div class="w-10 h-10 rounded-xl bg-emerald-500/20 text-emerald-400 flex items-center justify-center mb-1 text-sm">
                        <i class="fa-solid fa-plus"></i>
                    </div>
                    <span class="text-[11px] font-medium text-slate-300" data-i18n="addTx">记一笔</span>
                </button>
                <label class="flex flex-col items-center justify-center p-2.5 rounded-2xl bg-slate-800 hover:bg-slate-700 transition active:scale-95 border border-slate-700/60 shadow-sm cursor-pointer">
                    <div class="w-10 h-10 rounded-xl bg-blue-500/20 text-blue-400 flex items-center justify-center mb-1 text-sm">
                        <i class="fa-solid fa-file-excel"></i>
                    </div>
                    <span class="text-[11px] font-medium text-slate-300" data-i18n="import">导入</span>
                    <input type="file" id="importFile" accept=".xlsx, .xls, .csv, .json" class="hidden" onchange="promptImportCurrency(event)">
                </label>
                <button onclick="exportExcel()" class="flex flex-col items-center justify-center p-2.5 rounded-2xl bg-slate-800 hover:bg-slate-700 transition active:scale-95 border border-slate-700/60 shadow-sm">
                    <div class="w-10 h-10 rounded-xl bg-amber-500/20 text-amber-400 flex items-center justify-center mb-1 text-sm">
                        <i class="fa-solid fa-download"></i>
                    </div>
                    <span class="text-[11px] font-medium text-slate-300" data-i18n="export">导出</span>
                </button>
                <button onclick="openPasswordModal()" class="flex flex-col items-center justify-center p-2.5 rounded-2xl bg-slate-800 hover:bg-slate-700 transition active:scale-95 border border-slate-700/60 shadow-sm">
                    <div class="w-10 h-10 rounded-xl bg-purple-500/20 text-purple-400 flex items-center justify-center mb-1 text-sm">
                        <i class="fa-solid fa-key"></i>
                    </div>
                    <span class="text-[11px] font-medium text-slate-300" data-i18n="changePwd">改密</span>
                </button>
            </div>
        </div>
    </header>

    <main class="max-w-md mx-auto px-4 py-4 space-y-4">
        <!-- 时间范围选择条 -->
        <div class="bg-white p-3.5 rounded-2xl shadow-sm border border-slate-100 space-y-2.5">
            <div class="flex items-center justify-between">
                <span class="text-[11px] font-bold text-slate-400 uppercase tracking-wider flex items-center gap-1">
                    <i class="fa-solid fa-calendar-days text-indigo-500"></i> <span data-i18n="range">时间范围</span>
                </span>
                <button onclick="logout()" class="text-xs text-rose-500 font-semibold hover:underline flex items-center gap-1">
                    <i class="fa-solid fa-right-from-bracket"></i> <span data-i18n="logout">退出</span>
                </button>
            </div>
            <div class="flex items-center gap-1 overflow-x-auto no-scrollbar pb-1">
                <button onclick="setTimeRange('all')" id="btn-all" class="px-3 py-1.5 text-xs font-medium rounded-xl bg-indigo-600 text-white transition shrink-0 shadow-sm" data-i18n="all">全部</button>
                <button onclick="setTimeRange('today')" id="btn-today" class="px-3 py-1.5 text-xs font-medium rounded-xl bg-slate-100 text-slate-600 hover:bg-slate-200 transition shrink-0" data-i18n="today">今日</button>
                <button onclick="setTimeRange('week')" id="btn-week" class="px-3 py-1.5 text-xs font-medium rounded-xl bg-slate-100 text-slate-600 hover:bg-slate-200 transition shrink-0" data-i18n="week">本周</button>
                <button onclick="setTimeRange('month')" id="btn-month" class="px-3 py-1.5 text-xs font-medium rounded-xl bg-slate-100 text-slate-600 hover:bg-slate-200 transition shrink-0" data-i18n="month">本月</button>
                <button onclick="setTimeRange('year')" id="btn-year" class="px-3 py-1.5 text-xs font-medium rounded-xl bg-slate-100 text-slate-600 hover:bg-slate-200 transition shrink-0" data-i18n="year">本年</button>
            </div>
        </div>

        <!-- 图表统计区块 (双饼图支持：支出分类 / 收入分类) -->
        <div class="grid grid-cols-1 gap-4">
            <div class="bg-white p-4 rounded-2xl shadow-sm border border-slate-100">
                <div class="flex justify-between items-center mb-3">
                    <h3 class="text-xs font-bold text-slate-700 flex items-center gap-1.5">
                        <i class="fa-solid fa-chart-pie text-indigo-500"></i> <span id="chartTitleText" data-i18n="expCategoryChart">支出分类统计</span>
                    </h3>
                    <div class="flex bg-slate-100 p-0.5 rounded-lg text-[10px] font-semibold">
                        <button onclick="switchChartType('expense')" id="btnChartExp" class="px-2 py-1 rounded-md bg-white text-indigo-600 shadow-xs transition" data-i18n="expense">支出</button>
                        <button onclick="switchChartType('income')" id="btnChartInc" class="px-2 py-1 rounded-md text-slate-500 transition" data-i18n="income">收入</button>
                    </div>
                </div>
                <div class="relative h-48 flex items-center justify-center">
                    <canvas id="categoryChart"></canvas>
                </div>
            </div>

            <div class="bg-white p-4 rounded-2xl shadow-sm border border-slate-100">
                <h3 class="text-xs font-bold text-slate-700 mb-3 flex items-center gap-1.5">
                    <i class="fa-solid fa-chart-column text-indigo-500"></i> <span data-i18n="typeComparisonChart">收支类型对比 (折算后)</span>
                </h3>
                <div class="relative h-44 flex items-center justify-center">
                    <canvas id="typeComparisonChart"></canvas>
                </div>
            </div>
        </div>

        <!-- 筛选与账单卡片列表区块 -->
        <div class="bg-white rounded-2xl shadow-sm border border-slate-100 p-4 space-y-3">
            <div class="flex items-center justify-between">
                <h3 class="text-xs font-bold text-slate-700 tracking-wide uppercase" data-i18n="transactionsTitle">账单明细</h3>
                <div class="flex items-center gap-2">
                    <span id="txCount" class="text-[11px] text-slate-400">共 0 笔</span>
                    <button onclick="batchDeleteTransactions()" class="bg-rose-50 hover:bg-rose-100 text-rose-600 border border-rose-200 px-2.5 py-1 rounded-lg text-[11px] font-semibold transition flex items-center gap-1">
                        <i class="fa-solid fa-trash-can"></i> <span data-i18n="batchDelete">批量删除</span>
                    </button>
                </div>
            </div>

            <div class="flex gap-2">
                <div class="relative flex-1">
                    <span class="absolute inset-y-0 left-0 flex items-center pl-3 text-slate-400"><i class="fa-solid fa-search text-xs"></i></span>
                    <input type="text" id="searchInput" placeholder="搜索备注/分类..." oninput="filterTransactions()" class="w-full pl-8 pr-3 py-2 text-xs bg-slate-50 border border-slate-200 rounded-xl focus:outline-none focus:ring-1 focus:ring-indigo-500">
                </div>
                <select id="filterType" onchange="filterTransactions()" class="text-xs bg-slate-50 border border-slate-200 rounded-xl px-2.5 py-2 focus:outline-none font-medium">
                    <option value="" data-i18n="allTypes">全部类型</option>
                    <option value="收入" data-i18n="income">收入</option>
                    <option value="支出" data-i18n="expense">支出</option>
                </select>
            </div>

            <!-- 仿照参考图的移动端圆角账单卡片流 -->
            <div id="transactionCardList" class="space-y-2.5 pt-1"></div>
        </div>
    </main>

    <!-- 底部固定导航栏 (模仿参考图底部 TabBar) -->
    <nav class="fixed bottom-0 inset-x-0 bg-white/90 backdrop-blur-md border-t border-slate-200 z-40 py-2 px-6 flex justify-around items-center text-slate-500">
        <button onclick="window.scrollTo({top:0, behavior:'smooth'})" class="flex flex-col items-center gap-1 text-indigo-600">
            <i class="fa-solid fa-house text-base"></i>
            <span class="text-[10px] font-semibold" data-i18n="navHome">首页</span>
        </button>
        <button onclick="openModal()" class="w-12 h-12 -mt-5 rounded-full bg-indigo-600 text-white shadow-lg shadow-indigo-300 flex items-center justify-center text-lg hover:bg-indigo-700 transition active:scale-90">
            <i class="fa-solid fa-plus"></i>
        </button>
        <button onclick="exportExcel()" class="flex flex-col items-center gap-1 hover:text-slate-800">
            <i class="fa-solid fa-file-excel text-base"></i>
            <span class="text-[10px] font-medium" data-i18n="navExport">报表</span>
        </button>
    </nav>

    <!-- 图片查看大图弹窗 -->
    <div id="imagePreviewModal" onclick="closeImagePreview()" class="fixed inset-0 bg-slate-950/80 backdrop-blur-md hidden items-center justify-center z-50 p-4 cursor-pointer">
        <div class="relative max-w-lg w-full flex items-center justify-center">
            <img id="previewImgSrc" src="" class="max-h-[85vh] max-w-full rounded-2xl shadow-2xl object-contain">
        </div>
    </div>

    <!-- 修改密码弹窗 -->
    <div id="passwordModal" class="fixed inset-0 bg-slate-900/60 backdrop-blur-xs hidden items-center justify-center z-50 p-4">
        <div class="bg-white rounded-3xl max-w-xs w-full p-6 shadow-2xl space-y-4">
            <h3 class="font-bold text-slate-800 text-base" data-i18n="changePwd">修改密码</h3>
            <form onsubmit="changePassword(event)" class="space-y-3">
                <div>
                    <label class="block text-xs font-medium text-slate-500 mb-1" data-i18n="oldPwd">原密码</label>
                    <div class="relative">
                        <input type="password" id="oldPassword" required class="w-full text-sm bg-slate-50 border border-slate-200 rounded-xl px-3.5 py-2.5 pr-10 focus:outline-none focus:ring-2 focus:ring-indigo-500">
                        <button type="button" onclick="togglePasswordVisibility('oldPassword', 'oldPwdIcon')" class="absolute inset-y-0 right-0 pr-3 flex items-center text-slate-400 hover:text-slate-600">
                            <i id="oldPwdIcon" class="fa-solid fa-eye text-xs"></i>
                        </button>
                    </div>
                </div>
                <div>
                    <label class="block text-xs font-medium text-slate-500 mb-1" data-i18n="newPwd">新密码</label>
                    <div class="relative">
                        <input type="password" id="newPassword" required class="w-full text-sm bg-slate-50 border border-slate-200 rounded-xl px-3.5 py-2.5 pr-10 focus:outline-none focus:ring-2 focus:ring-indigo-500">
                        <button type="button" onclick="togglePasswordVisibility('newPassword', 'newPwdIcon')" class="absolute inset-y-0 right-0 pr-3 flex items-center text-slate-400 hover:text-slate-600">
                            <i id="newPwdIcon" class="fa-solid fa-eye text-xs"></i>
                        </button>
                    </div>
                    <p class="text-[10px] text-slate-400 mt-1" data-i18n="pwdTipText">密码需不少于8位，包含大小写字母、数字和特殊字符</p>
                </div>
                <div class="pt-2 flex justify-end gap-2">
                    <button type="button" onclick="closePasswordModal()" class="px-3.5 py-2 text-xs font-medium text-slate-500 hover:bg-slate-100 rounded-xl transition" data-i18n="cancel">取消</button>
                    <button type="submit" class="px-4 py-2 text-xs font-bold bg-indigo-600 hover:bg-indigo-700 text-white rounded-xl transition shadow-md shadow-indigo-100" data-i18n="confirmChange">确认修改</button>
                </div>
            </form>
        </div>
    </div>

    <!-- 导入币种选择弹窗 -->
    <div id="importModal" class="fixed inset-0 bg-slate-900/60 backdrop-blur-xs hidden items-center justify-center z-50 p-4">
        <div class="bg-white rounded-3xl max-w-xs w-full p-6 shadow-2xl space-y-4">
            <h3 class="font-bold text-slate-800 text-base" data-i18n="importModalTitle">选择导入币种</h3>
            <p class="text-xs text-slate-400" data-i18n="importModalDesc">请为本次导入的所有账单指定币种：</p>
            <div>
                <select id="importCurrencySelect" class="w-full text-sm bg-slate-50 border border-slate-200 rounded-xl px-3.5 py-3 focus:outline-none focus:ring-2 focus:ring-indigo-500 font-semibold">
                    <option value="CNY">CNY (人民币)</option>
                    <option value="EUR">EUR (欧元)</option>
                    <option value="USD">USD (美元)</option>
                    <option value="GBP">GBP (英镑)</option>
                    <option value="JPY">JPY (日元)</option>
                </select>
            </div>
            <div class="pt-2 flex justify-end gap-2">
                <button type="button" onclick="cancelImport()" class="px-3.5 py-2 text-xs font-medium text-slate-500 hover:bg-slate-100 rounded-xl transition" data-i18n="cancel">取消</button>
                <button type="button" onclick="confirmImport()" class="px-4 py-2 text-xs font-bold bg-indigo-600 hover:bg-indigo-700 text-white rounded-xl transition shadow-md shadow-indigo-100" data-i18n="confirm">确认导入</button>
            </div>
        </div>
    </div>

    <!-- 记账/编辑弹窗 -->
    <div id="transactionModal" class="fixed inset-0 bg-slate-900/60 backdrop-blur-xs hidden items-center justify-center z-50 p-4">
        <div class="bg-white rounded-3xl max-w-md w-full p-6 shadow-2xl space-y-4 max-h-[90vh] overflow-y-auto">
            <div class="flex justify-between items-center border-b border-slate-100 pb-3">
                <h3 id="modalTitleText" class="font-bold text-slate-800 text-base" data-i18n="modalTitle">添加新记账</h3>
                <button onclick="closeModal()" class="text-slate-400 hover:text-slate-600 w-8 h-8 flex items-center justify-center rounded-lg hover:bg-slate-100 transition"><i class="fa-solid fa-xmark text-base"></i></button>
            </div>
            <form id="transactionForm" onsubmit="saveTransaction(event)" class="space-y-3.5">
                <input type="hidden" id="txEditId">
                <div>
                    <label class="block text-xs font-medium text-slate-500 mb-1" data-i18n="modalDate">日期与时间</label>
                    <input type="datetime-local" id="txDate" required class="w-full text-sm bg-slate-50 border border-slate-200 rounded-xl px-3.5 py-2.5 focus:outline-none focus:ring-2 focus:ring-indigo-500">
                </div>
                <div class="grid grid-cols-2 gap-3">
                    <div>

        function togglePasswordVisibility(inputId, iconId) {
            const input = document.getElementById(inputId);
            const icon = document.getElementById(iconId);
            if (!input || !icon) return;
            if (input.type === 'password') {
                input.type = 'text';
                icon.className = "fa-solid fa-eye-slash text-xs";
            } else {
                input.type = 'password';
                icon.className = "fa-solid fa-eye text-xs";
            }
        }

        function validateStrongPassword(password) {
            return password.length >= 8 && /[A-Z]/.test(password) && /[a-z]/.test(password) && /[0-9]/.test(password) && /[^A-Za-z0-9]/.test(password);
        }

            const dict = translations[currentLang] || translations.zh;
            document.querySelectorAll('[data-i18n]').forEach(el => {
                const key = el.getAttribute('data-i18n');
                if (dict[key]) el.innerText = dict[key];

        function switchAuthMode(mode) {
            authMode = mode;
            const loginBtn = document.getElementById('tabLoginBtn');
            const regBtn = document.getElementById('tabRegBtn');
            const submitBtn = document.getElementById('authSubmitBtn');
            const pwdTip = document.getElementById('pwdTip');
            const dict = translations[currentLang] || translations.zh;
            
            if (mode === 'login') {
                if (loginBtn) loginBtn.className = "flex-1 py-2 text-xs font-bold rounded-lg bg-white text-indigo-600 shadow-sm transition";
                if (regBtn) regBtn.className = "flex-1 py-2 text-xs font-bold rounded-lg text-slate-500 transition";

                if (pwdTip) pwdTip.classList.add('hidden');
            } else {
                if (regBtn) regBtn.className = "flex-1 py-2 text-xs font-bold rounded-lg bg-white text-indigo-600 shadow-sm transition";
                if (loginBtn) loginBtn.className = "flex-1 py-2 text-xs font-bold rounded-lg text-slate-500 transition";
                if (submitBtn) submitBtn.innerText = dict.regBtn;
                if (pwdTip) pwdTip.classList.remove('hidden');
            }

        async function handleAuth(e) {
            e.preventDefault();
            const username = document.getElementById('authUsername').value.trim();
            const password = document.getElementById('authPassword').value.trim();
            const errBox = document.getElementById('authErrorMsg');
            const submitBtn = document.getElementById('authSubmitBtn');
            if (errBox) errBox.classList.add('hidden');

            if (!username || !password) return;

            if (authMode === 'register' && !validateStrongPassword(password)) {
                if (errBox) {
                    errBox.innerText = "密码必须不少于8位，且包含大写字母、小写字母、数字和特殊字符！";
                    errBox.classList.remove('hidden');
                }
                return;
            }

            if (submitBtn) submitBtn.disabled = true;

            try {
                const endpoint = authMode === 'login' ? `${API_BASE}/login` : `${API_BASE}/register`;
                const res = await fetch(endpoint, {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify({ username, password })
                });

                const result = await res.json();
                if (!res.ok) throw new Error(result.detail || "操作失败");

                if (authMode === 'register') {
                    alert('注册成功！请直接登录。');
                    switchAuthMode('login');
                    if (submitBtn) submitBtn.disabled = false;
                    return;
                }

                currentUserId = username;
                await fetchUserDataFromPostgres();
                
                const userDisp = document.getElementById('userDisplay');
                const userAvatar = document.getElementById('userAvatarText');
                if (userDisp) userDisp.innerText = username;
                if (userAvatar) userAvatar.innerText = username.charAt(0).toUpperCase();
                
                const authOv = document.getElementById('authOverlay');
                if (authOv) authOv.classList.add('hidden');
            } catch (err) {
                console.error(err);
                if (errBox) {
                    errBox.innerText = err.message;
                    errBox.classList.remove('hidden');
                }
                if (submitBtn) submitBtn.disabled = false;
            }
        }

        async function fetchUserDataFromPostgres() {
            try {
                const res = await fetch(`${API_BASE}/ledgers/${currentUserId}`);
                const data = await res.json();
                if (data && data.content) {
                    if (Array.isArray(data.content)) {
                        transactions = data.content;
                    } else if (data.content["默认账本"]) {
                        transactions = data.content["默认账本"];
                    } else {
                        transactions = [];
                    }
                    if (data.content["_customCategories"]) {
                        userCustomCategories = data.content["_customCategories"];
                    }
                } else {
                    transactions = [];
                }
            } catch (err) {
                console.error("加载数据失败", err);
                transactions = [];
            }
            renderAll();
        }

        async function saveToPostgres() {
            if (!currentUserId) return;
            try {
                await fetch(`${API_BASE}/ledgers`, {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify({ 
                        user_id: currentUserId, 
                        content: { 
                            "默认账本": transactions,
                            "_customCategories": userCustomCategories 
                        } 
                    })
                });
            } catch (err) {
                console.error("同步到数据库失败", err);
            }
        }

                alert('密码修改成功！');

        function saveTransaction(e) {
            e.preventDefault();
            const editId = document.getElementById('txEditId').value;
            const dateVal = document.getElementById('txDate').value.replace('T', ' ');
            const groupVal = document.getElementById('txGroup').value;
            const categoryVal = document.getElementById('txCategory').value;
            const typeVal = document.getElementById('txType').value;
            const currencyVal = document.getElementById('txCurrency').value;
            const amountVal = parseFloat(document.getElementById('txAmount').value);
            const noteVal = document.getElementById('txNote').value || '';
            const imageVal = document.getElementById('txImageBase64').value || '';

            if (editId) {
                const index = transactions.findIndex(t => t.id === editId);
                if (index !== -1) {
                    transactions[index] = { ...transactions[index], date: dateVal, group: groupVal, category: categoryVal, type: typeVal, currency: currencyVal, amount: amountVal, note: noteVal, image: imageVal };
                }
            } else {
                const newTx = { id: Date.now().toString(), date: dateVal, group: groupVal, category: categoryVal, type: typeVal, currency: currencyVal, amount: amountVal, note: noteVal, image: imageVal };
                transactions.unshift(newTx);
            }

            saveAndRender();
            closeModal();

        function batchDeleteTransactions() {
            const checkboxes = document.querySelectorAll('.row-checkbox:checked');
            if (checkboxes.length === 0) {
                alert('请先勾选需要删除的账单！');
                return;
            }
            if (confirm(`确定要删除选中的 ${checkboxes.length} 条账单吗？`)) {
                const idsToDelete = Array.from(checkboxes).map(cb => cb.getAttribute('data-id'));
                transactions = transactions.filter(t => !idsToDelete.includes(t.id));
                saveAndRender();
            }

        function filterTransactions() {
            const search = document.getElementById('searchInput').value.toLowerCase();
            const filterType = document.getElementById('filterType').value;
            const now = new Date();
            const todayStr = now.toISOString().slice(0, 10);

            const filtered = transactions.filter(t => {
                const matchSearch = (t.note && t.note.toLowerCase().includes(search)) || (t.category && t.category.toLowerCase().includes(search)) || (t.group && t.group.toLowerCase().includes(search));
                const matchType = !filterType || t.type === filterType;

                let matchTime = true;
                if (t.date) {
                    const txDateOnly = t.date.slice(0, 10);
                    if (currentTimeRange === 'today') {
                        matchTime = (txDateOnly === todayStr);
                    } else if (currentTimeRange === 'week') {
                        const txDate = new Date(t.date);
                        const firstDayOfWeek = new Date(now);
                        firstDayOfWeek.setDate(now.getDate() - now.getDay());
                        firstDayOfWeek.setHours(0,0,0,0);
                        matchTime = (txDate >= firstDayOfWeek);
                    } else if (currentTimeRange === 'month') {
                        matchTime = txDateOnly.startsWith(todayStr.slice(0, 7));
                    } else if (currentTimeRange === 'year') {
                        matchTime = txDateOnly.startsWith(todayStr.slice(0, 4));
                    }
                }
                return matchSearch && matchType && matchTime;
            });

            renderCardList(filtered);
            updateSummaryAndCharts(filtered);
        }

        function convertToCNY(amount, currency) {
            return amount * (exchangeRates[currency || 'CNY'] || 1.0);
        }

        function formatCurrency(amount, currency) {
            return `${currency || 'CNY'} ${Number(amount).toFixed(2)}`;
        }

                        </div>
                    </div>
                    <div class="flex flex-col items-end gap-1.5">
                        <span class="font-extrabold text-sm ${isInc ? 'text-emerald-600' : 'text-slate-800'}">

                        </span>
                        <div class="flex items-center gap-2">
                            ${hasImg ? `<img src="${t.image}" class="w-6 h-6 object-cover rounded-md border border-slate-200 cursor-pointer shadow-xs" onclick="previewFullImage('${t.image}')" title="凭证">` : ''}

                        </div>
                    </div>
                </div>
            `;}).join('');
        }

        function updateSummaryAndCharts(data) {
            const targetCurrency = baseCurrency; 
            const targetRate = exchangeRates[targetCurrency] || 1.0;

            let totalIncConverted = 0;
            let totalExpConverted = 0;
            let expByCategory = {};
            let incByCategory = {};

            data.forEach(t => {
                const curr = t.currency || 'CNY';
                const amt = Number(t.amount) || 0;
                const isInc = t.type === '收入' || t.type === 'Income';

                const amountInCNY = convertToCNY(amt, curr);
                const amountInBase = amountInCNY / targetRate;

                if (isInc) {
                    totalIncConverted += amountInBase;
                    incByCategory[t.category] = (incByCategory[t.category] || 0) + amountInBase;
                } else {
                    totalExpConverted += amountInBase;
                    expByCategory[t.category] = (expByCategory[t.category] || 0) + amountInBase;
                }
            });

            const symbol = targetCurrency === 'CNY' ? '¥' : (targetCurrency === 'EUR' ? '€' : (targetCurrency === 'USD' ? '$' : (targetCurrency === 'GBP' ? '£' : '¥')));
            
            document.getElementById('totalIncomeConverted').innerText = `${symbol} ${totalIncConverted.toFixed(2)}`;
            document.getElementById('totalExpenseConverted').innerText = `${symbol} ${totalExpConverted.toFixed(2)}`;
            
            const netConverted = totalIncConverted - totalExpConverted;
            const balanceElem = document.getElementById('netBalanceConverted');
            balanceElem.innerText = `${symbol} ${netConverted.toFixed(2)}`;

            renderCharts(currentChartMode === 'expense' ? expByCategory : incByCategory, totalIncConverted, totalExpConverted, symbol);
        }

        function renderCharts(categoryData, totalInc, totalExp, symbol) {
            const catCtx = document.getElementById('categoryChart');
            if (!catCtx) return;
            
            const categories = Object.keys(categoryData);
            const amounts = Object.values(categoryData);

            if (categoryChart) categoryChart.destroy();
            categoryChart = new Chart(catCtx.getContext('2d'), {
                type: 'doughnut',
                data: {
                    labels: categories.length ? categories : ['暂无数据'],
                    datasets: [{ data: amounts.length ? amounts : [1], backgroundColor: ['#6366f1', '#ec4899', '#8b5cf6', '#10b981', '#f59e0b', '#3b82f6', '#14b8a6', '#f43f5e'] }]
                },
                options: { responsive: true, maintainAspectRatio: false, plugins: { legend: { position: 'right', labels: { boxWidth: 10, font: { size: 10 } } } } }
            });

            const typeCtx = document.getElementById('typeComparisonChart');
            if (!typeCtx) return;

            if (typeChart) typeChart.destroy();
            typeChart = new Chart(typeCtx.getContext('2d'), {
                type: 'bar',
                data: {
                    labels: ['总收入', '总支出'],
                    datasets: [{ data: [totalInc, totalExp], backgroundColor: ['#10b981', '#f43f5e'], borderRadius: 6 }]
                },
                options: { responsive: true, maintainAspectRatio: false, plugins: { legend: { display: false } }, scales: { y: { beginAtZero: true } } }
            });
        }

        function parseExcelDate(serial) {
            if (!serial) return new Date().toISOString().slice(0, 19).replace('T', ' ');
            if (typeof serial === 'string' && isNaN(Number(serial))) return serial;
            const num = Number(serial);
            if (isNaN(num)) return String(serial);
            const utc_days = Math.floor(num - 25569);
            const date_info = new Date(utc_days * 86400 * 1000);
            return date_info.toISOString().slice(0, 19).replace('T', ' ');
        }

        function exportExcel() {
            if (transactions.length === 0) { alert('没有数据可导出！'); return; }
            const exportData = transactions.map(t => ({ "日期": t.date, "分类筛选": t.group, "记账分类": t.category, "收支类型": t.type, "备注": t.note, "金额": t.amount, "币种": t.currency || 'CNY' }));
            const worksheet = XLSX.utils.json_to_sheet(exportData);
            const workbook = XLSX.utils.book_new();
            XLSX.utils.book_append_sheet(workbook, worksheet, "Transactions");
            XLSX.writeFile(workbook, `expense_tracker_${new Date().toISOString().slice(0,10)}.xlsx`);
        }

        function promptImportCurrency(event) {
            const file = event.target.files[0];
            if (!file) return;
            pendingImportFile = file;
            document.getElementById('importModal').classList.remove('hidden');
            document.getElementById('importModal').classList.add('flex');
            event.target.value = '';
        }

        function cancelImport() {
            pendingImportFile = null;
            const im = document.getElementById('importModal');
            im.classList.remove('flex');
            im.classList.add('hidden');
        }

        function confirmImport() {
            if (!pendingImportFile) { cancelImport(); return; }
            const selectedCurrency = document.getElementById('importCurrencySelect').value;
            const file = pendingImportFile;
            cancelImport();

            const reader = new FileReader();
            reader.onload = function(e) {
                try {
                    const data = new Uint8Array(e.target.result);
                    const workbook = XLSX.read(data, { type: 'array' });
                    const jsonRows = XLSX.utils.sheet_to_json(workbook.Sheets[workbook.SheetNames[0]], { header: 1 });
                    if (jsonRows.length < 2) { alert('文件内容为空！'); return; }

                    const header = jsonRows[0];
                    const dateIdx = header.findIndex(h => h && String(h).includes('日期')) !== -1 ? header.findIndex(h => h && String(h).includes('日期')) : 0;
                    const groupIdx = header.findIndex(h => h && String(h).includes('分类筛选')) !== -1 ? header.findIndex(h => h && String(h).includes('分类筛选')) : 1;
                    const catIdx = header.findIndex(h => h && String(h).includes('记账分类')) !== -1 ? header.findIndex(h => h && String(h).includes('记账分类')) : 2;
                    const typeIdx = header.findIndex(h => h && String(h).includes('收支')) !== -1 ? header.findIndex(h => h && String(h).includes('收支')) : 3;
                    const noteIdx = header.findIndex(h => h && String(h).includes('备注')) !== -1 ? header.findIndex(h => h && String(h).includes('备注')) : 4;
                    const amtIdx = header.findIndex(h => h && String(h).includes('金额')) !== -1 ? header.findIndex(h => h && String(h).includes('金额')) : 5;

                    const newTxs = [];
                    for (let i = 1; i < jsonRows.length; i++) {
                        const row = jsonRows[i];
                        if (!row || row.length === 0) continue;
                        if (row[dateIdx] !== undefined && row[dateIdx] !== null) {
                            newTxs.push({
                                id: 'imp_' + Date.now() + '_' + i,
                                date: parseExcelDate(row[dateIdx]),
                                group: row[groupIdx] !== undefined ? String(row[groupIdx]) : "Other",
                                category: row[catIdx] !== undefined ? String(row[catIdx]) : "Uncategorized",
                                type: row[typeIdx] !== undefined ? String(row[typeIdx]) : "支出",
                                currency: row[6] !== undefined ? String(row[6]) : selectedCurrency,
                                amount: parseFloat(row[amtIdx] || 0),
                                note: row[noteIdx] !== undefined ? String(row[noteIdx]) : "",
                                image: ""
                            });
                        }
                    }
                    if (newTxs.length > 0) {
                        transactions = [...newTxs, ...transactions];
                        saveAndRender();
                        alert(`成功导入 ${newTxs.length} 条记录！`);
                    } else {
                        alert('未读取到有效数据。');
                    }
                } catch (err) {
                    alert('导入失败，请检查文件格式！');
                }
            };
            reader.readAsArrayBuffer(file);
        }

        applyLanguage();
    </script>
</body>
</html>
